name: run unit tests of feature branches

on:
  push:
    branches: 
      'feature/*'
      
jobs:
  run-unit-test:
    runs-on: ubuntu-latest
    
    steps: 
      - name: Checkout
        uses: actions/checkout@v3.3.0
        
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          
      - name: Build with Maven
        run: mvn clean compile
