name: cp4 e2e pipeline
run-name: Build from user @${{ github.actor }}

on: 
  workflow_dispatch:
  
jobs: 
  build:  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

        
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'java' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Build Java project (safe mode)
      run: | 
       chmod +x mvnw || true
          if [ -f "./mvnw" ]; then
            ./mvnw clean compile -DskipTests || echo "Build failed, continuing CodeQL"
          else
            mvn clean compile -DskipTests || echo "Maven not available, continuing CodeQL"
          fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
